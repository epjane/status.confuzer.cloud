---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: status
spec:
  replicas: 1 #multiple replicas causes extra pings
  selector:
    matchLabels:
      app: gatus
  template:
    metadata:
      labels:
        app: gatus
    spec:
      containers:
        - name: gatus
          image: twinproduction/gatus:latest
          ports:
            - containerPort: 8080
          env:
            - name: GATUS_CONFIG_PATH
              value: /config/config.yaml
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: gatus-config
---
apiVersion: v1
kind: Service
metadata:
  name: gatus
  namespace: status
spec:
  selector:
    app: gatus
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
