apiVersion: v1
kind: Namespace
metadata:
  name: status
  labels:
    name: status
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: status
data:
  config.yaml: |
    ui:
      title: "confuzer status"
      description: "status page for confuzer (nextcloud and other services)"
      dashboard-heading: "confuzer status"
      dashboard-subheading: "status page for confuzer (nextcloud and other services)"
      default-sort-by: group

    alerting:
      matrix:
        homeserver: "${MATRIX_HOMESERVER}"
        access-token: "${MATRIX_ACCESS_TOKEN}"
        internal-room-id: "${MATRIX_ROOM_ID}"

        default-alert:
          send-on-resolved: true
          failure-threshold: 3
          success-threshold: 2


    endpoints:
      - name: nextcloud
        group: confuzer
        url: "https://drive.confuzer.cloud"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 480h"
        alerts:
          - type: matrix

      - name: refuzer
        group: confuzer
        url: "https://refuzer.confuzer.cloud"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 480h"
        alerts:
          - type: matrix

      - name: backup
        group: confuzer
        url: "http://backup.confuzer.cloud"
        interval: 60s
        conditions:
          - "[STATUS] == 401"
        alerts:
          - type: matrix

      - name: confuzer
        group: confuzer
        url: "https://confuzer.cloud"
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 480h"
        alerts:
